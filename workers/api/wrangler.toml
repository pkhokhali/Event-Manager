name = "event-manager-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "event-manager-db"
database_id = "19a07556-5f71-4bdf-b0e9-7a2de9618668"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "event-manager-uploads"

[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "push-notifications"

[triggers]
crons = ["* * * * *", "15 2 * * *"]

[vars]
ADMIN_USERNAME = "admin"
CORS_ORIGINS = "https://event-manager-admin.pages.dev,http://localhost:5173,http://localhost:8081"
R2_PUBLIC_URL = ""
R2_ACCOUNT_ID = "0213275117eb200b5fc047ea4d7950e3"
R2_BUCKET_NAME = "event-manager-uploads"
